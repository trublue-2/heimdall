services:
  app:
    image: ghcr.io/trublue-2/heimdall:latest
    container_name: heimdall
    init: true
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/version',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.heimdall.rule=Host(`heimdall.trublue.ch`)"
      - "traefik.http.routers.heimdall.entrypoints=websecure"
      - "traefik.http.routers.heimdall.tls.certresolver=letsencrypt"
      - "traefik.http.services.heimdall.loadbalancer.server.port=3000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.heimdall-http.rule=Host(`heimdall.trublue.ch`)"
      - "traefik.http.routers.heimdall-http.entrypoints=web"
      - "traefik.http.routers.heimdall-http.middlewares=heimdall-https-redirect"
      - "traefik.http.middlewares.heimdall-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.heimdall-https-redirect.redirectscheme.permanent=true"
    networks:
      - traefik

  # MQTT-Broker für den Session-Fenster-Push (Server→Box). TLS terminiert Traefik über
  # einen TCP-Router (HostSNI mqtt.trublue.ch, Entrypoint `mqtts` auf :8883 — muss in der
  # Traefik-Static-Config definiert sein); intern spricht der Broker plaintext auf 1883.
  # Auth/ACL kommen vom Heimdall-HTTP-Backend (/api/mqtt/*), Reuse der Device-Token.
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    container_name: heimdall-mqtt
    init: true
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.heimdall-mqtt.rule=HostSNI(`mqtt.trublue.ch`)"
      - "traefik.tcp.routers.heimdall-mqtt.entrypoints=mqtts"
      - "traefik.tcp.routers.heimdall-mqtt.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.heimdall-mqtt.loadbalancer.server.port=1883"
    networks:
      - traefik

networks:
  traefik:
    external: true
