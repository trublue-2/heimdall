# Heimdall MQTT-Broker (mosquitto-go-auth).
# TLS terminiert Traefik (TCP-Router, HostSNI mqtt.trublue.ch → hier plaintext 1883).
# Auth/ACL delegiert an das Heimdall-HTTP-Backend (reuse der Device-Token).

per_listener_settings false

listener 1883
allow_anonymous false

# Retained status-Topics (online/offline) überleben Broker-Neustart.
persistence true
persistence_location /mosquitto/data/

# ── go-auth: HTTP-Backend gegen den Heimdall-Server ────────────────────────
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_method POST
auth_opt_http_host heimdall
auth_opt_http_port 3000
auth_opt_http_getuser_uri /api/mqtt/user
auth_opt_http_superuser_uri /api/mqtt/superuser
auth_opt_http_aclcheck_uri /api/mqtt/acl
# Antwort- und Parameter-Format müssen zu src/lib/mqttAuth.ts passen ({"Ok": bool} / JSON-Body).
auth_opt_http_response_mode json
auth_opt_http_params_mode json
# Auth-Ergebnisse cachen → entlastet das bcrypt-Backend (Box verbindet nur im Wachfenster).
auth_opt_cache true
auth_opt_cache_seconds 60
# error statt info: go-auth loggt sonst bei jedem Box-Publish "api error: " (Superuser-Miss —
# eine Box ist kein Superuser), obwohl der ACL-Check danach greift. Reines Rauschen.
auth_opt_log_level error
# Lesbare Broker-Zeitstempel; lokale Zeit kommt aus TZ=Europe/Zurich (docker-compose.yml).
log_timestamp_format %Y-%m-%dT%H:%M:%S
