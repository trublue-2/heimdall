[env:lolin_d32]
extra_scripts = pre:bump_version.py
platform  = espressif32
board     = lolin_d32
framework = arduino

; Partitionstabelle 1:1 identisch mit der Werks-Firmware der Ziel-Box (aus 4-MB-Dump dekodiert,
; byte-genau verifiziert). Nötig für die OTA-Übernahme: deren HTTPUpdate schreibt Heimdalls App
; in app1 @ 0x1c0000 (max 1728K) DIESER Tabelle. 2× 1728K App-Slots für OTA + Rollback;
; App ~1 MB → passt. nvs/otadata liegen wie zuvor (0x9000/0xe000), also KEIN Re-Provisionieren
; gegenüber min_spiffs nötig.
board_build.partitions = partitions_target.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed    = 115200

lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  rweather/Crypto @ ^0.4.0  ; Ed25519 + SHA256 für signierte OTA
  knolleary/PubSubClient @ ^2.8  ; MQTT-Client (Session-Fenster-Push)

build_flags =
  -DCORE_DEBUG_LEVEL=3
