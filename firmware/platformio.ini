[env:lolin_d32]
extra_scripts = pre:bump_version.py
platform  = espressif32
board     = lolin_d32
framework = arduino

; OTA-fähige Partitionstabelle: 2× ~1,9 MB App-Slots (app0/app1) für OTA + Rollback.
; App ist ~1 MB → passt locker. ACHTUNG: verschiebt NVS → nach dem ersten Flash mit
; dieser Tabelle Credentials einmalig neu provisionieren.
board_build.partitions = min_spiffs.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed    = 115200

lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0

build_flags =
  -DCORE_DEBUG_LEVEL=3
