name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── TypeCheck ────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci --registry https://registry.npmjs.org
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ── Docker Image bauen & nach GHCR pushen ───────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volle Historie für git rev-list (Build-Nummer)

      - name: Read version + build number
        run: |
          echo "VERSION=$(jq -r .version server/package.json)" >> $GITHUB_ENV
          echo "APP_BUILD=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ env.VERSION }}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance/SBOM-Attestation abschalten — deren Push zur GHCR verursachte
          # wiederholt 504-Fehler beim Deploy. Für ein privates Single-Image unnötig.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.run_started_at }}
            APP_BUILD=${{ env.APP_BUILD }}

  # ── Deploy auf Server ────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: [typecheck, build-and-push]
    runs-on: ubuntu-latest
    environment: kink
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_PATH
          script: |
            DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\n\r')"
            cd "$DEPLOY_PATH"
            echo "→ Image pullen ..."
            docker compose pull
            echo "→ Container neu starten ..."
            docker compose up -d --force-recreate
            echo "→ Alte Images aufräumen ..."
            docker image prune -f
            echo "✓ Heimdall deployed."
