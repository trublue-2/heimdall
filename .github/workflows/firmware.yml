name: Firmware Build & Publish (OTA)

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
  workflow_dispatch:

jobs:
  build-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: kink # gleiche SSH-Deploy-Credentials wie der Server-Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Read FW version from config.h
        run: |
          FW=$(grep -oE 'FW_VERSION[[:space:]]+"[^"]+"' firmware/src/config.h | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "FW=$FW" >> "$GITHUB_ENV"
          echo "Firmware-Version: $FW"

      # Signierte OTA: Ed25519-Signatur über sha256(.bin). Privater Key NUR hier
      # (Secret OTA_SIGNING_KEY = base64 des 32-Byte-Seeds), nie im Repo. Die Box
      # verifiziert mit dem eingebrannten Public Key und flasht nur bei Match.
      - name: Sign firmware (Ed25519 over sha256)
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          pip install --quiet pynacl
          python3 -c "import base64,hashlib,os,nacl.signing; sk=nacl.signing.SigningKey(base64.b64decode(os.environ['OTA_SIGNING_KEY'])); d=hashlib.sha256(open('firmware/.pio/build/lolin_d32/firmware.bin','rb').read()).digest(); open('firmware/.pio/build/lolin_d32/firmware.sig','w').write(sk.sign(d).signature.hex())"
          echo "Signatur: $(cat firmware/.pio/build/lolin_d32/firmware.sig)"

      # .bin + .sig in den Home des Deploy-Users laden (dort hat er Schreibrecht)
      - name: Copy .bin + .sig to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "firmware/.pio/build/lolin_d32/firmware.bin,firmware/.pio/build/lolin_d32/firmware.sig"
          target: heimdall-ota
          strip_components: 4

      # In das App-Volume schreiben (über docker compose cp → richtige Perms)
      - name: Publish into container volume
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FW: ${{ env.FW }}
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_PATH,FW
          script: |
            DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\n\r')"
            cd "$DEPLOY_PATH"
            docker compose exec -T app mkdir -p /app/data/firmware
            # Reihenfolge: erst .sig + .bin, version.txt ZULETZT (sie ist der OTA-Trigger
            # — so sieht die Box nie eine neue Version ohne passende Signatur).
            docker compose cp "$HOME/heimdall-ota/firmware.sig" app:/app/data/firmware/latest.sig
            docker compose cp "$HOME/heimdall-ota/firmware.bin" app:/app/data/firmware/latest.bin
            printf '%s\n' "$FW" | docker compose exec -T app sh -c 'cat > /app/data/firmware/version.txt'
            rm -f "$HOME/heimdall-ota/firmware.bin" "$HOME/heimdall-ota/firmware.sig"
            echo "Firmware $FW (signiert) veroeffentlicht - Boxen ziehen beim naechsten Sync."
